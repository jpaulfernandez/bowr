[project]
name = "bowr-worker"
version = "0.0.0"
description = "bowr media and ML processing worker (runs on Modal)"
requires-python = "==3.12.*"
# Runtime dependencies arrive with the slices that need them (P0.03 media validation).
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bowr_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]
