# Pinned model manifest (ARCHITECTURE sections 3.1 and 10.1).
# Validated by packages/contracts/src/model-manifest.ts and generated into
# supabase/functions/_shared/generated/ai-catalog.json (pnpm contracts:generate).
# Clients never choose models, prompts or prices; the gateway reads task aliases
# from this file.
#
# Prices are integer USD micros per million tokens ($1 = 1,000,000). They come
# from ARCHITECTURE section 10.1 and MUST be re-verified against Google's current
# price list before AI is enabled in any environment (P0.05-T5 gate). Output
# billing includes thinking tokens.
schema_version: 1

tasks:
  # Synthetic, content-free call used to prove the budget guard end to end.
  diagnostic:
    provider: gemini
    model: gemini-3.1-flash-lite
    prompt_version: diagnostic-v1
    output_schema_version: 1
    max_input_tokens: 200
    max_output_tokens: 64
    thinking: disabled
    safety_margin_percent: 10
    lighter:
      model: gemini-3.1-flash-lite
      max_output_tokens: 32
    prices:
      - effective_from: "2026-01-01"
        input_per_mtok_micros: 250000
        output_per_mtok_micros: 1500000

  # Structured tags for one garment photo (P1.02). Extraction caps from
  # ARCHITECTURE 10.2; thinking disabled. Candidate choice is provisional until
  # the P1.07 blind comparison.
  item_tags:
    provider: gemini
    model: gemini-3.1-flash-lite
    prompt_version: item-tags-v1
    output_schema_version: 1
    max_input_tokens: 20000
    max_output_tokens: 2048
    thinking: disabled
    safety_margin_percent: 10
    lighter:
      model: gemini-3.1-flash-lite
      max_output_tokens: 1024
    prices:
      - effective_from: "2026-01-01"
        input_per_mtok_micros: 250000
        output_per_mtok_micros: 1500000

  # Care-label reading (P1.03): brand, size and material from one label photo.
  # The output is three short strings, so the output cap is small.
  label_read:
    provider: gemini
    model: gemini-3.1-flash-lite
    prompt_version: label-read-v1
    output_schema_version: 1
    max_input_tokens: 20000
    max_output_tokens: 256
    thinking: disabled
    safety_margin_percent: 10
    lighter:
      model: gemini-3.1-flash-lite
      max_output_tokens: 256
    prices:
      - effective_from: "2026-01-01"
        input_per_mtok_micros: 250000
        output_per_mtok_micros: 1500000

# Local models baked into the worker image. Each entry pins a revision and the
# SHA-256 of the weights; nothing is downloaded at runtime. The worker image and
# `pnpm worker:models` fetch these files at build time and verify the checksum.
# Cutout choice is provisional until the P1.07 real-photo comparison; the
# license lines name the upstream model and must be re-verified before staging.
local_models:
  # Default cutout (salient-object segmentation, 1024 px input). IS-Net / DIS.
  isnet_general_use:
    source: https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx
    revision: rembg-v0.0.0
    sha256: 60920e99c45464f2ba57bee2ad08c919a52bbf852739e96947fbb4358c0d964a
    license: Apache-2.0 (upstream DIS/IS-Net; ONNX export published by rembg, MIT)
  # Alternate-model retry (U-2-Netp, 320 px input); a different architecture.
  u2netp:
    source: https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx
    revision: rembg-v0.0.0
    sha256: 309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8
    license: Apache-2.0 (upstream U-2-Net; ONNX export published by rembg, MIT)
